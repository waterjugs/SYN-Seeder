name: Security Review

# Every pull request from a branch of this repository: Claude reviews the
# changes for security problems and comments on the lines it flags. The check
# fails if the review couldn't run or found something, so a green tick means
# this exact commit was reviewed and nothing was found.
#
# Needs an Anthropic API key in the CLAUDE_API_KEY secret. Pull requests from
# forks and from Dependabot don't get secrets, so they're skipped. That also
# keeps the review to people who can push here: the action isn't hardened
# against text in a pull request that tries to steer Claude.

on:
  pull_request:
    # Pictures, fonts and documents have nothing to review. (If this check is
    # ever made required, drop this: a workflow skipped here never reports.)
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.ico'
      - '**/*.ttf'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write  # to comment on the pull request

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's own commit, so line numbers match its diff.
          ref: ${{ github.event.pull_request.head.sha }}
          # Claude reads this folder, so the job's token isn't left in it.
          persist-credentials: false

      # Pinned to a commit (main on 2026-02-11): the action is given the API
      # key and may write to pull requests.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          # The action's own default model has been retired.
          claude-model: claude-opus-5-5
          # Review every push. Left off, only the first push to a pull request
          # is reviewed, and a first try that fails is never repeated.
          run-every-commit: true

      - name: Fail if the review didn't finish or found something
        # The action itself passes either way: it only warns when the review
        # fails, and only comments when it finds something.
        run: |
          results=claudecode-results.json
          if [ ! -s "$results" ] || ! jq -e 'type == "object"' "$results" > /dev/null 2>&1; then
            echo "::error::The security review left no result, so this pull request wasn't reviewed. The step above says why."
            exit 1
          fi
          error=$(jq -r '.error // empty | tostring | split("\n")[0] | .[0:300]' "$results")
          if [ -n "$error" ]; then
            echo "::error::The security review failed, so this pull request wasn't reviewed: $error"
            exit 1
          fi
          if jq -e '.analysis_summary.review_completed == false' "$results" > /dev/null 2>&1; then
            echo "::error::Claude didn't finish the security review, so this pull request wasn't reviewed. The step above says why."
            exit 1
          fi
          count=$(jq '[.findings[]?] | length' "$results")
          if [ "$count" -gt 0 ]; then
            # Listed here too: the action comments only once per pull request.
            jq -r '.findings[]? | "- \(.severity // "?") \(.file // "?"):\(.line // "?") \(.description // "" | tostring | gsub("[\r\n]+"; " "))"' "$results"
            echo "::error::The security review found $count possible problem(s): listed above, and in the pull request's comments or the security-review-results file."
            exit 1
          fi
          echo "The security review finished and found nothing."
