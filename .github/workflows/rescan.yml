name: rescan

# Throwaway check: asks VirusTotal to scan two files it already has again, by
# their SHA-256, without uploading anything: the published v1.0.0 SynSeeder.exe,
# and the plain AutoHotkey 2.0.18 program that every SynSeeder.exe is built on.

on:
  push:
    branches: ["check/rescan-*"]

permissions:
  contents: read

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rescan on VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: >-
          python3 tools/vt_scan.py
          --rescan 905ebe538bdc1fa4fd27abed34782ab7cff74221ede40df7dc4d3fdae3fc9b61:SynSeeder-1.0.0-release.exe
          --rescan 70031669fef8c365a243322c52df9c3f854271489e67c5a9fc3139f56bc357e9:AutoHotkey64-2.0.18.exe
