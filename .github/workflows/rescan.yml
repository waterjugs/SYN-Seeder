name: rescan

# Throwaway check, read only: prints the latest VirusTotal verdicts on three
# files VirusTotal already has, including what Microsoft's engine said and
# which definitions it used. Nothing is uploaded or rescanned.

on:
  push:
    branches: ["check/rescan-*"]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show each file's latest VirusTotal verdicts
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request
          key = os.environ["VT_API_KEY"]
          files = {
              "SynSeeder 1.0.0 release": "905ebe538bdc1fa4fd27abed34782ab7cff74221ede40df7dc4d3fdae3fc9b61",
              "SynSeeder 1.0.1 draft": "310808ee554facb4b860218fc2b9e131fee670d2d9065661811882de2b80d690",
              "AutoHotkey64 2.0.18": "70031669fef8c365a243322c52df9c3f854271489e67c5a9fc3139f56bc357e9",
          }
          def stamp(t):
              return time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime(t)) if t else "?"
          for i, (name, sha) in enumerate(files.items()):
              if i:
                  time.sleep(16)  # the free API allows 4 requests a minute
              request = urllib.request.Request("https://www.virustotal.com/api/v3/files/" + sha, headers={"x-apikey": key})
              a = json.load(urllib.request.urlopen(request, timeout=120))["data"]["attributes"]
              results = a.get("last_analysis_results", {})
              print(name, "| last scan", stamp(a.get("last_analysis_date")), "|", json.dumps(a.get("last_analysis_stats")))
              print("  Microsoft:", json.dumps(results.get("Microsoft")))
              print("  engines not undetected:", sorted(e + "=" + v.get("category", "?") for e, v in results.items() if v.get("category") not in ("undetected", "harmless")))
              print("  first seen", stamp(a.get("first_submission_date")), "| times submitted", a.get("times_submitted"), "| size", a.get("size"))
          EOF
