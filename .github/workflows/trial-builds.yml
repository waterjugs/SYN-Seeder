name: trial builds

# Builds the native trial versions of SynSeeder in probes/ (C# and AutoHotkey,
# in several variants) and scans every exe on VirusTotal, to find a way to
# ship an exe that no antivirus flags. Runs on pushes to trial/ branches, or
# from the Actions tab. Results show as notes on the run and in its summary.

on:
  push:
    branches: ["trial/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csharp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the C# trials
        shell: bash
        run: |
          mkdir -p trials
          for v in full noupdate bare; do
            dotnet build probes/cs -c Release -p:Variant=$v -o out/$v --no-incremental -nologo
            cp out/$v/SynSeeder.exe trials/SynSeeder-cs-$v.exe
          done
          ls -l trials
          sha256sum trials/*
      - name: Self-test
        shell: pwsh
        run: |
          foreach ($v in "full", "noupdate") {
            $p = Start-Process -FilePath "trials\SynSeeder-cs-$v.exe" -ArgumentList "--selftest", "$pwd\cs-$v.log" -PassThru
            $null = $p.Handle
            $done = $p.WaitForExit(180000)
            if (-not $done) { $p.Kill() }
            if (Test-Path "cs-$v.log") { Get-Content "cs-$v.log" }
            if ($done -and $p.ExitCode -eq 0) { echo "::notice title=C# $v self-test::passed" }
            else { echo "::warning title=C# $v self-test::failed (finished: $done, exit code: $($p.ExitCode))" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: trials-cs
          path: trials/

  autohotkey:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 2.0.18 is the version the old seeder (0/71) was built on. Round 2 showed 2.0.31 draws more
      # flags (Gridinsoft and Microsoft), so round 3 only uses 2.0.18.
      AHK_VERSIONS: "2.0.18"
      # Round 3: does the one flag left on the full build come from the button images or the code?
      AHK_VARIANTS: "bare full full-noimg bare-img full-bmp noupdate"
    steps:
      - uses: actions/checkout@v4
      - name: Get AutoHotkey and Ahk2Exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From AutoHotkey's GitHub releases: autohotkey.com puts a browser check in front of downloads.
          # Pinned by SHA-256, since whatever we ship is built on one of these.
          $known = @{
            "2.0.18" = "70031669FEF8C365A243322C52DF9C3F854271489E67C5A9FC3139F56BC357E9"
            "2.0.31" = "5073EE85DA091653C7C6CE32CACDA3A0B4BFB51649823C10015BA0BD71ACB73C"
          }
          New-Item -ItemType Directory -Force trials | Out-Null
          foreach ($version in $env:AHK_VERSIONS -split ' ') {
            gh release download "v$version" --repo AutoHotkey/AutoHotkey --pattern "*.zip" --dir "ahk-download\$version"
            if ($LASTEXITCODE -ne 0) { echo "::error title=AutoHotkey $version::couldn't download it"; exit 1 }
            $zip = Get-ChildItem "ahk-download\$version\*.zip" | Select-Object -First 1
            Expand-Archive $zip.FullName "ahk-tools\$version"
            $base = Get-Item "ahk-tools\$version\AutoHotkey64.exe"
            $hash = (Get-FileHash $base.FullName).Hash
            echo "AutoHotkey64.exe $version from $($zip.Name): $($base.Length) bytes, $hash"
            if ($hash -ne $known[$version]) { echo "::error title=AutoHotkey $version::unexpected SHA-256 $hash"; exit 1 }
            # Scan the plain interpreter too, to see whether a flag comes from AutoHotkey itself.
            Copy-Item $base.FullName "trials\AutoHotkey64-$version.exe"
          }
          gh release download --repo AutoHotkey/Ahk2Exe --pattern "*.zip" --dir ahk2exe-zip
          Expand-Archive (Get-ChildItem ahk2exe-zip\*.zip | Select-Object -First 1).FullName ahk-tools\ahk2exe
          Get-ChildItem ahk2exe-zip
          $compiler = Get-ChildItem ahk-tools\ahk2exe -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          echo "Ahk2Exe.exe $($compiler.VersionInfo.FileVersion), $((Get-FileHash $compiler.FullName).Hash)"
          echo "AHK2EXE=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Make BMP copies of the button images
        shell: pwsh
        run: |
          # For the full-bmp trial: the same images, stored as uncompressed 24-bit BMP files.
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force build\bmp | Out-Null
          foreach ($png in Get-ChildItem templates\*.png) {
            $image = [System.Drawing.Image]::FromFile($png.FullName)
            $bitmap = New-Object System.Drawing.Bitmap $image.Width, $image.Height, ([System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.DrawImage($image, (New-Object System.Drawing.Rectangle 0, 0, $image.Width, $image.Height))
            $graphics.Dispose()
            $bitmap.Save("$pwd\build\bmp\$($png.BaseName).bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
            $bitmap.Dispose(); $image.Dispose()
          }
          Get-ChildItem build\bmp | Measure-Object -Property Length -Sum | ForEach-Object { echo "$($_.Count) BMP files, $($_.Sum) bytes" }
      - name: Check the scripts load
        shell: pwsh
        run: |
          $bad = $false
          foreach ($version in $env:AHK_VERSIONS -split ' ') {
            foreach ($v in $env:AHK_VARIANTS -split ' ') {
              $p = Start-Process -FilePath "ahk-tools\$version\AutoHotkey64.exe" -ArgumentList "/ErrorStdOut", "/Validate", "probes\ahk\$v.ahk" -NoNewWindow -PassThru -RedirectStandardOutput "validate.out" -RedirectStandardError "validate.err"
              $null = $p.Handle
              if (-not $p.WaitForExit(60000)) { $p.Kill(); echo "::error title=AutoHotkey $version $v::validation hung"; $bad = $true; continue }
              $text = (Get-Content "validate.out", "validate.err" -Raw -ErrorAction SilentlyContinue) -join ""
              echo "$version ${v}: exit $($p.ExitCode) $text"
              if ($p.ExitCode -ne 0 -or $text -match "Error|Warning") { echo "::error title=AutoHotkey $version $v::the script doesn't load cleanly"; $bad = $true }
            }
          }
          if ($bad) { exit 1 }
      - name: Compile the AutoHotkey trials
        shell: pwsh
        run: |
          foreach ($version in $env:AHK_VERSIONS -split ' ') {
            foreach ($v in $env:AHK_VARIANTS -split ' ') {
              $out = "$pwd\trials\SynSeeder-ahk-$version-$v.exe"
              $p = Start-Process -FilePath $env:AHK2EXE -ArgumentList "/in", "$pwd\probes\ahk\$v.ahk", "/out", $out, "/base", "$pwd\ahk-tools\$version\AutoHotkey64.exe", "/compress", "0", "/silent", "verbose" -NoNewWindow -PassThru -RedirectStandardOutput "compile.out" -RedirectStandardError "compile.err"
              $null = $p.Handle
              if (-not $p.WaitForExit(120000)) { $p.Kill(); echo "::error title=Ahk2Exe $version $v::compiling hung"; exit 1 }
              Get-Content "compile.out", "compile.err" -ErrorAction SilentlyContinue
              if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { echo "::error title=Ahk2Exe $version $v::compiling failed (exit code $($p.ExitCode))"; exit 1 }
            }
          }
          Get-ChildItem trials | ForEach-Object { echo "$($_.Name) $($_.Length) bytes $((Get-FileHash $_.FullName).Hash)" }
      - name: Self-test
        shell: pwsh
        run: |
          foreach ($version in $env:AHK_VERSIONS -split ' ') {
            foreach ($v in "full", "full-bmp") {
              $name = "ahk-$version-$v"
              $p = Start-Process -FilePath "trials\SynSeeder-$name.exe" -ArgumentList "--selftest", "$pwd\$name.log" -PassThru
              $null = $p.Handle
              $done = $p.WaitForExit(120000)
              if (-not $done) { $p.Kill() }
              if (Test-Path "$name.log") { Get-Content "$name.log" }
              if ($done -and $p.ExitCode -eq 0) { echo "::notice title=AutoHotkey $version $v self-test::passed" }
              else { echo "::warning title=AutoHotkey $version $v self-test::failed (finished: $done, exit code: $($p.ExitCode))" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: trials-ahk
          path: trials/

  scan:
    needs: [csharp, autohotkey]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trials-*
          merge-multiple: true
          path: trials
      - name: Scan on VirusTotal
        # A flagged trial is a result, not a broken build: the notes on the run say which.
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        # Round 3 scans only the new AutoHotkey trials, plus a rescan of the C# full build,
        # which never got a verdict (VirusTotal lost its analysis twice).
        run: python3 tools/vt_scan.py --rescan a0b5f301e94b4e0eb43ede5b9f5ca7e35bcfb353c5f72de56a1867a4eb1da83e:SynSeeder-cs-full.exe trials/SynSeeder-ahk-*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt-results
          path: vt-results.json
          if-no-files-found: ignore
